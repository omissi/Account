name: Android runtime smoke test

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        shell: bash
        run: |
          if [ -d vitra/app ]; then cd vitra; fi
          gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and inspect
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "$(find . -path '*/app/build/outputs/apk/debug/app-debug.apk' -print -quit)"
            adb logcat -c
            adb shell am force-stop tech.alomessi.vitra
            adb shell am start -W -n tech.alomessi.vitra/.MainActivity
            sleep 4
            mkdir -p runtime-evidence
            adb logcat -d > runtime-evidence/runtime-logcat.txt
            adb exec-out screencap -p > runtime-evidence/runtime-first-launch.png
            adb shell uiautomator dump /sdcard/vitra-ui.xml || true
            adb pull /sdcard/vitra-ui.xml runtime-evidence/runtime-ui.xml || true
            test -n "$(adb shell pidof tech.alomessi.vitra | tr -d '\r')"
            ! grep -q "FATAL EXCEPTION.*tech.alomessi.vitra" runtime-evidence/runtime-logcat.txt
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vitra-runtime-evidence
          path: |
            vitra/docs/runtime-*.png
            vitra/docs/runtime-*.txt
            vitra/docs/runtime-*.xml
            docs/runtime-*.png
            docs/runtime-*.txt
            docs/runtime-*.xml
            runtime-evidence/*
          if-no-files-found: warn
