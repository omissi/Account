name: Temporary Glassify Transfer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        run: |
          curl -fL --retry 3 -o Glassify-debug.apk "https://tmpfiles.org/dl/1786942779.03963e43419bd545/wXwXColDAwAw/glassify-debug.apk"
          test -s Glassify-debug.apk
          python3 - <<'PY'
          p='Glassify-debug.apk'
          with open(p,'rb') as f:
              sig=f.read(4)
          print('SIGNATURE=', sig.hex())
          assert sig.startswith(b'PK'), f'Not an APK/ZIP signature: {sig!r}'
          PY
          ls -lh Glassify-debug.apk
          sha256sum Glassify-debug.apk
      - name: Commit APK temporarily
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Glassify-debug.apk
          git commit -m "chore: temporary Glassify APK transfer" || true
          git push origin main
